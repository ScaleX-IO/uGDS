name: Rust bindings

on:
  push:
    branches: [main]
    paths:
      - include/ugds.h
      - rust/**
      - .github/workflows/rust-bindings.yml
  pull_request:
    paths:
      - include/ugds.h
      - rust/**
      - .github/workflows/rust-bindings.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ugds-sys:
    name: ugds-sys (${{ matrix.toolchain }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, '1.85.0']
    defaults:
      run:
        working-directory: rust/ugds-sys
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
      - name: Check generated bindings
        if: matrix.toolchain == 'stable'
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev
          cargo install bindgen-cli --version 0.73.2 --locked
          ./regen.sh
          git diff --exit-code -- src/bindings.rs
      - name: Format
        if: matrix.toolchain == 'stable'
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
